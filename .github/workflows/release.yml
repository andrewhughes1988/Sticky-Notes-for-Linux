name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist -- --linux deb AppImage --publish never

      - name: Generate checksums
        working-directory: release
        run: sha256sum ./*.deb ./*.AppImage > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.deb release/*.AppImage release/SHA256SUMS.txt --generate-notes
